name: CI

# Quality gate before deploy — lint + production build only.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm install --include=optional
          npm install --no-save \
            @rolldown/binding-linux-x64-gnu@1.2.3 \
            lightningcss-linux-x64-gnu@1.33.0 \
            @tailwindcss/oxide-linux-x64-gnu@4.3.3

      - name: Lint (ESLint)
        run: npm run lint

      - name: Production build
        run: npm run build
