name: Deploy to Vercel

# Production: push/manual on `main` → --prod
#   → https://assessa.sstcloud.com.au
#   → https://assessa-ragavendrenv-5507s-projects.vercel.app
# Development: push/manual on `develop` → preview (not --prod)
#   → https://assessa-git-develop-ragavendrenv-5507s-projects.vercel.app
# Pull requests → ephemeral preview URL

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - production
          - development

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Do NOT bind GitHub Environments here — env-scoped VERCEL_TOKEN secrets
# override the repo secret and commonly break `vercel pull` with
# "Could not retrieve Project Settings".
env:
  VERCEL_ORG_ID: team_sKKMMuszjU4cd4Ag6IY6ZLEb
  VERCEL_PROJECT_ID: prj_yXSFIGCjYkIwYAV3FGwAFLVCvhmX

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          IS_PROD=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "production" ]]; then
            IS_PROD=true
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            IS_PROD=true
          fi

          if [[ "$IS_PROD" == "true" ]]; then
            echo "label=production" >> "$GITHUB_OUTPUT"
            echo "prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "label=development" >> "$GITHUB_OUTPUT"
            echo "prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Missing repo secret VERCEL_TOKEN. Create one at https://vercel.com/account/tokens"
            echo "then: gh secret set VERCEL_TOKEN --repo ragavendren/assessa"
            exit 1
          fi
          vercel whoami --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          # Remote build+deploy (avoids local vercel pull/link issues)
          if [[ "${{ steps.target.outputs.prod }}" == "true" ]]; then
            URL=$(vercel deploy --yes --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed (${{ steps.target.outputs.label }}): $URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `### Assessa preview\n\n${url}\n\n- Production: https://assessa.sstcloud.com.au\n- Development branch: https://assessa-git-develop-ragavendrenv-5507s-projects.vercel.app`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Summarize URLs
        if: always()
        shell: bash
        run: |
          {
            echo "## Assessa deploy (${{ steps.target.outputs.label }})"
            echo ""
            echo "- **This deployment:** ${{ steps.deploy.outputs.url }}"
            echo "- **Production:** https://assessa.sstcloud.com.au"
            echo "- **Production (Vercel):** https://assessa-ragavendrenv-5507s-projects.vercel.app"
            echo "- **Development:** https://assessa-git-develop-ragavendrenv-5507s-projects.vercel.app"
            echo ""
            echo "Uses repo secret \`VERCEL_TOKEN\` only (do not set the same name under GitHub Environments)."
          } >> "$GITHUB_STEP_SUMMARY"
