name: Deploy to Vercel

# Runs after CI succeeds on the same commit (workflow_run), or manually.
# Production: main → --prod → https://assessa.sstcloud.com.au
# Development: develop → preview → https://assessa-git-develop-ragavendrenv-5507s-projects.vercel.app

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - production
          - development

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: vercel-deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_sKKMMuszjU4cd4Ag6IY6ZLEb
  VERCEL_PROJECT_ID: prj_yXSFIGCjYkIwYAV3FGwAFLVCvhmX

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip failed CI (manual dispatch always allowed)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          IS_PROD=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "production" ]]; then
            IS_PROD=true
          elif [[ "$BRANCH" == "main" ]]; then
            IS_PROD=true
          fi

          if [[ "$IS_PROD" == "true" ]]; then
            echo "label=production" >> "$GITHUB_OUTPUT"
            echo "prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "label=development" >> "$GITHUB_OUTPUT"
            echo "prod=false" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Missing repo secret VERCEL_TOKEN. Create one at https://vercel.com/account/tokens"
            echo "then: gh secret set VERCEL_TOKEN --repo ragavendren/assessa"
            exit 1
          fi
          vercel whoami --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ "${{ steps.target.outputs.prod }}" == "true" ]]; then
            URL=$(vercel deploy --yes --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed (${{ steps.target.outputs.label }} / ${{ steps.target.outputs.branch }}): $URL"

      - name: Summarize URLs
        if: always()
        shell: bash
        run: |
          {
            echo "## Assessa deploy (${{ steps.target.outputs.label }})"
            echo ""
            echo "- **Branch:** ${{ steps.target.outputs.branch }}"
            echo "- **This deployment:** ${{ steps.deploy.outputs.url }}"
            echo "- **Production:** https://assessa.sstcloud.com.au"
            echo "- **Production (Vercel):** https://assessa-ragavendrenv-5507s-projects.vercel.app"
            echo "- **Development:** https://assessa-git-develop-ragavendrenv-5507s-projects.vercel.app"
            echo ""
            echo "Deploy runs only after **CI** succeeds (format, lint, typecheck, build)."
          } >> "$GITHUB_STEP_SUMMARY"
